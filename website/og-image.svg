<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0c"/>
      <stop offset="100%" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1f1f22" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- mark -->
  <g transform="translate(80, 90)">
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#accent)" stroke-width="3.5"/>
    <path d="M19 33 L29 43 L48 24" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="160" y="138" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" fill="#f4f4f5">OSCAR</text>
  <text x="160" y="170" font-family="JetBrains Mono, monospace" font-size="14" fill="#9ca3af">v0.3.0 · MIT</text>

  <!-- headline -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="68" fill="#f4f4f5" letter-spacing="-2">A GitHub-specialized</text>
  <text x="80" y="395" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="68" fill="#f4f4f5" letter-spacing="-2">AI coding assistant</text>
  <text x="80" y="470" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600" font-size="68" fill="#fb923c" letter-spacing="-2">for VS Code.</text>

  <!-- meta row -->
  <g transform="translate(80, 540)" font-family="JetBrains Mono, monospace" font-size="16" fill="#9ca3af">
    <text>Asterix agent</text>
    <text x="190">·</text>
    <text x="210">Gemini 2.5 Flash</text>
    <text x="430">·</text>
    <text x="450">FastAPI + SSE</text>
    <text x="640">·</text>
    <text x="660">VS Code sidebar</text>
  </g>

  <!-- corner tag -->
  <g transform="translate(1000, 90)">
    <rect width="120" height="34" rx="17" fill="none" stroke="#fb923c" stroke-width="1.5"/>
    <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="13" fill="#fb923c" text-anchor="middle">CAPSTONE</text>
  </g>
</svg>
